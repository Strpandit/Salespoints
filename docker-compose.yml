services:
  postgres:
    image: postgres:16-alpine
    container_name: salespoints_postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=8MB"
    environment:
      POSTGRES_DB: ${DB_NAME:-salespoint_prod}
      POSTGRES_USER: ${DB_USERNAME:-salespoints}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Salespoints@9261}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_BIND:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-salespoints} -d ${DB_NAME:-salespoint_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
    networks:
      - salespoints_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: salespoints_app:latest
    container_name: salespoints_web
    restart: unless-stopped
    command: ["./bin/thrust", "./bin/rails", "server"]
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      WEB_CONCURRENCY: ${WEB_WORKERS:-2}
      DB_POOL: ${WEB_DB_POOL:-8}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1280m
    networks:
      - salespoints_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 150s

  worker_payment:
    image: salespoints_app:latest
    container_name: salespoints_worker_payment
    restart: unless-stopped
    command: ["./bin/rails", "solid_queue:start"]
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_CONFIG: config/solid_queue/payments.yml
      SOLID_QUEUE_SKIP_RECURRING: "true"
      PAYMENT_WORKER_THREADS: ${PAYMENT_WORKER_THREADS:-5}
      DB_POOL: ${PAYMENT_DB_POOL:-8}
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 640m
    networks:
      - salespoints_net
  worker_whatsapp:
    image: salespoints_app:latest
    container_name: salespoints_worker_whatsapp
    restart: unless-stopped
    command: ["./bin/rails", "solid_queue:start"]
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_CONFIG: config/solid_queue/whatsapp.yml
      SOLID_QUEUE_SKIP_RECURRING: "true"
      WHATSAPP_WORKER_THREADS: ${WHATSAPP_WORKER_THREADS:-5}
      DB_POOL: ${WHATSAPP_DB_POOL:-8}
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 640m
    networks:
      - salespoints_net

  worker_general:
    image: salespoints_app:latest
    container_name: salespoints_worker_general
    restart: unless-stopped
    command: ["./bin/rails", "solid_queue:start"]
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_CONFIG: config/solid_queue/general.yml
      SOLID_QUEUE_RECURRING_SCHEDULE: config/recurring.yml
      GENERAL_WORKER_THREADS: ${GENERAL_WORKER_THREADS:-6}
      REPORTS_WORKER_THREADS: ${REPORTS_WORKER_THREADS:-3}
      DB_POOL: ${GENERAL_DB_POOL:-12}
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 1536m
    networks:
      - salespoints_net

  # 6. Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: salespoints_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_started
    mem_limit: 128m
    networks:
      - salespoints_net

  # 7. Certbot (on-demand only). Enable with: docker compose --profile ssl run --rm certbot ...
  #    See DEPLOYMENT_GUIDE.md "SSL Certificate Setup".
  certbot:
    image: certbot/certbot:latest
    container_name: salespoints_certbot
    profiles: ["ssl"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: ["certbot"]

volumes:
  pgdata:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

networks:
  salespoints_net:
    driver: bridge
