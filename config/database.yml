default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 10) } %>
  timeout: 5000
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "salespoints_v2_dev") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "salespoints_v2_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "salespoint_prod") %>
