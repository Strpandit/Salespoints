production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  b2b_order_cleanup:
    class: B2bOrderCleanupJob
    queue: cleanup
    schedule: every minute

  cleanup_stuck_payment_attempts:
    class: CleanupStuckPaymentAttemptsJob
    queue: cleanup
    schedule: every 15 minutes

  cleanup_unpaid_orders:
    class: CleanupUnpaidOrdersJob
    queue: cleanup
    schedule: every 30 minutes

  cleanup_old_notifications:
    class: CleanupOldNotificationsJob
    queue: cleanup
    schedule: at 3am every day

  cleanup_old_webhook_events:
    class: CleanupOldWebhookEventsJob
    queue: cleanup
    schedule: at 3:15am every day

  cleanup_old_broadcast_trackers:
    class: CleanupOldBroadcastTrackersJob
    queue: cleanup
    schedule: at 3:30am every day

  wholesaler_post_expiry_reminder:
    class: WholesalerPostExpiryReminderJob
    queue: cleanup
    schedule: every 10 minutes
