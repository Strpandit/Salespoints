default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 300
  workers:
    - queues: [ "cleanup", "scheduled" ]
      threads: 2
      processes: 1
      polling_interval: 1

production:
  <<: *default

development:
  <<: *default

test:
  <<: *default
